# إعداد النشر على Render: خدمة واحدة تخدم الـ API وصفحة الأهل ولوحة الإدارة.
# القيم السرية (sync: false) تُدخل يدوياً من Render -> Environment، ولا تُكتب هنا.
services:
  - type: web
    name: smart-school-bus
    runtime: python
    rootDir: "Bus backend"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DEVICE_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: APP_TIMEZONE
        value: UTC
      - key: SCHOOL_LAT
        sync: false
      - key: SCHOOL_LNG
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: OSRM_URL
        value: https://router.project-osrm.org
