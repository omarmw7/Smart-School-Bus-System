{% extends "layout.html" %}

{% block title %}{{ 'تعديل طالب' if student.student_id else 'إضافة طالب' }}{% endblock %}
{% block page_title %}{{ 'تعديل طالب' if student.student_id else 'إضافة طالب' }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
{% endblock %}

{% block content %}
  <form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="name">اسم الطالب</label>
      <input type="text" id="name" name="name" value="{{ student.name or '' }}" required autofocus>
    </div>
    <div class="field">
      <label for="fingerprint_id">رقم البصمة</label>
      <input type="number" id="fingerprint_id" name="fingerprint_id" min="0" value="{{ student.fingerprint_id if student.fingerprint_id is not none else '' }}" required>
    </div>
    <div class="field">
      <label for="parent_phone">هاتف ولي الأمر</label>
      <input type="tel" id="parent_phone" name="parent_phone" class="ltr" value="{{ student.parent_phone or '' }}" required>
    </div>
    <div class="field">
      <label for="bus_id">الحافلة</label>
      <select id="bus_id" name="bus_id" required>
        <option value="" disabled {% if not student.bus_id %}selected{% endif %}>اختر الحافلة</option>
        {% for b in buses %}
        <option value="{{ b.bus_id }}" {% if student.bus_id|string == b.bus_id|string %}selected{% endif %}>حافلة {{ b.bus_id }} - {{ b.driver_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="status">الحالة</label>
      <select id="status" name="status">
        <option value="active" {% if student.status != 'inactive' %}selected{% endif %}>نشط</option>
        <option value="inactive" {% if student.status == 'inactive' %}selected{% endif %}>غير نشط</option>
      </select>
    </div>
    <div class="field">
      <label>موقع البيت (اختياري، اضغط على الخريطة أو انقل العلامة)</label>
      <div class="row">
        <input type="number" step="any" id="home_lat" name="home_lat" class="ltr" placeholder="خط العرض" value="{{ student.home_lat if student.home_lat is not none else '' }}">
        <input type="number" step="any" id="home_lng" name="home_lng" class="ltr" placeholder="خط الطول" value="{{ student.home_lng if student.home_lng is not none else '' }}">
      </div>
      <div id="home-map" style="height:320px;border-radius:12px;margin-top:8px" aria-label="خريطة موقع البيت"></div>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">حفظ</button>
      <a class="btn" href="{{ '/students/' ~ student.student_id if student.student_id else '/students' }}">إلغاء</a>
    </div>
  </form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function () {
  var latIn = document.getElementById('home_lat');
  var lngIn = document.getElementById('home_lng');
  var schoolLat = {{ school_coords[0]|tojson }};
  var schoolLng = {{ school_coords[1]|tojson }};
  var homeLat = parseFloat(latIn.value);
  var homeLng = parseFloat(lngIn.value);
  var hasHome = isFinite(homeLat) && isFinite(homeLng);
  var center = hasHome ? [homeLat, homeLng]
             : (schoolLat !== null && schoolLng !== null ? [schoolLat, schoolLng] : [25.2048, 55.2708]);
  var map = L.map('home-map').setView(center, 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  var marker = null;
  function place(lat, lng) {
    if (!marker) {
      marker = L.marker([lat, lng], { draggable: true }).addTo(map);
      marker.on('dragend', function () {
        var p = marker.getLatLng();
        latIn.value = p.lat.toFixed(6);
        lngIn.value = p.lng.toFixed(6);
      });
    } else {
      marker.setLatLng([lat, lng]);
    }
  }
  if (hasHome) place(homeLat, homeLng);
  if (schoolLat !== null && schoolLng !== null) {
    L.circleMarker([schoolLat, schoolLng], { radius: 7, color: '#4d5a67' }).addTo(map)
      .bindTooltip('المدرسة');
  }
  map.on('click', function (e) {
    place(e.latlng.lat, e.latlng.lng);
    latIn.value = e.latlng.lat.toFixed(6);
    lngIn.value = e.latlng.lng.toFixed(6);
  });
  [latIn, lngIn].forEach(function (input) {
    input.addEventListener('change', function () {
      var lat = parseFloat(latIn.value), lng = parseFloat(lngIn.value);
      if (isFinite(lat) && isFinite(lng)) { place(lat, lng); map.panTo([lat, lng]); }
    });
  });
})();
</script>
{% endblock %}
